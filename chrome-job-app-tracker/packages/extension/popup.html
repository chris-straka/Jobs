<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Save job posting</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fff;
        --fg: #111;
        --muted: #666;
        --field: #fff;
        --border: #ccc;
        --btn: #f0f0f0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1e1e1e;
          --fg: #e8e8e8;
          --muted: #aaa;
          --field: #2d2d2d;
          --border: #555;
          --btn: #3a3a3a;
        }
      }
      /* NOTE: transparent html + body radius does NOT round the popup
         window on macOS Chrome (verified by screenshot) — the frame is
         drawn by the browser. Everything inside is rounded instead. */
      body {
        width: 360px;
        font:
          13px/1.4 system-ui,
          sans-serif;
        margin: 12px;
        background: var(--bg);
        color: var(--fg);
      }
      label {
        display: block;
        margin: 8px 0 2px;
        font-weight: 600;
      }
      input,
      select,
      textarea {
        width: 100%;
        box-sizing: border-box;
        font: inherit;
        background: var(--field);
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 5px 7px;
      }
      textarea {
        height: 120px;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      .row[hidden] {
        display: none;
      }
      .row > div {
        flex: 1;
      }
      #status {
        margin-top: 8px;
        white-space: pre-wrap;
      }
      #count {
        color: var(--muted);
        font-size: 12px;
      }
      .hint {
        color: var(--muted);
        font-size: 12px;
        white-space: pre-wrap;
        margin-top: 8px;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 12px;
        transform: translateX(-50%);
        max-width: 320px;
        background: var(--fg);
        color: var(--bg);
        border-radius: 12px;
        padding: 8px 14px;
        font-size: 12px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        white-space: pre-wrap;
      }
      #toast[hidden],
      #host-hint[hidden] {
        display: none;
      }
      button {
        width: 100%;
        box-sizing: border-box;
        font: inherit;
        margin-top: 8px;
        padding: 6px;
        background: var(--btn);
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <div id="health">● checking server…</div>
    <div class="row" id="native-row" hidden>
      <div><button id="srv-toggle" type="button">Start server</button></div>
    </div>
    <div class="row" id="copy-row">
      <div><button id="copy-srv" type="button">⧉ Copy start cmd</button></div>
    </div>
    <div id="host-hint" class="hint" hidden></div>
    <div id="toast" hidden></div>
    <label for="company">Company</label>
    <input id="company" />
    <label for="role">Role title</label>
    <input id="role" />
    <div>
      <label for="region">Region</label>
      <select id="region">
        <option value="ca">CA</option>
        <option value="us">US</option>
        <option value="uk">UK</option>
      </select>
    </div>
    <label for="description">Posting text <span id="count"></span></label>
    <textarea id="description"></textarea>
    <button id="save" type="button">Save to Jobs repo</button>
    <button id="mark-applied" type="button">Mark applied ✓</button>
    <div id="status"></div>
    <details id="fp-wrap">
      <summary>Ignored sites (<span id="fp-count">0</span>)</summary>
      <ul id="fp-list"></ul>
    </details>
    <script src="dist/popup.js"></script>
  </body>
</html>
